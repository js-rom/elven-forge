# =============================================================================
# OpenSpec — Global Domain Router
# =============================================================================
# This file ONLY routes to per-domain configuration. It contains no project
# defaults, no schema, no persistence settings, no rules, no tdd settings and
# no state. Every domain owns its configuration and its state inside its own
# directory.
#
#   config:  openspec/artifacts/{domain}/config.yaml
#   state:   openspec/artifacts/{domain}/state.yaml
#
# HOW TO MAINTAIN:
#   - The storage skill registers a domain here (adds a `domains` entry) when
#     it creates `openspec/artifacts/{domain}/config.yaml`. This is an
#     orchestrator-only change.
#   - Never duplicate per-domain settings (schema, persistence, rules, tdd)
#     in this file.
#   - Recovery: to resume work, read this file, then read each domain state at
#     `openspec/artifacts/{domain}/state.yaml`. The active domain is the one
#     with `status: in_progress` (if several, ask the user which one to resume).
# =============================================================================

domains:
  # - domain: my-domain
  #   config_path: openspec/artifacts/my-domain/config.yaml
