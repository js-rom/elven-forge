# =============================================================================
# Domain Configuration — openspec/artifacts/{domain}/config.yaml
# =============================================================================
# This file is the single source of configuration for this domain.
# The storage skill creates it from this template when the domain is
# registered (during inception PASO 0), and the domain is added to the
# global router at `openspec/config.yaml`.
#
# There is NO global defaults file: every key here is domain-specific.
# Resolution order for domain config:
#   1. openspec/artifacts/{domain}/config.yaml   (authoritative)
#   2. .agents/skills/storage/openspec/domain-config.template.yaml (seed fallback)
#
# Keep the `context` block CONCISE - no more than 10 lines.
# =============================================================================

domain: ""                              # kebab-case domain identifier, must match the folder name

schema: default                         # active schema under openspec/schemas/{schema}/

# Root directory where this domain's artifacts live. Artifact paths are
# resolved as {artifacts_root}/{path} where {path} comes from the active
# schema's `path` field (see storage SKILL.md "Path Resolution Contract").
artifacts_root: openspec/artifacts/{domain}/

context: |
  Tech stack: {detected}
  Architecture: {detected}
  Testing: {detected}
  Style: {detected}

rules:
  chat language: Spanish
  artifacts language: Spanish, except for domain objects, source code, tests, identifiers, and code comments which MUST be in English.
  inception:
    - use project defined [schema](./openspec/schemas/default/schema.yaml)
  elaboration:
    - use project defined [schema](./openspec/schemas/default/schema.yaml)
  tdd:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  persistence:
    mode: master-only
    archive_iterations: false
    merge_deltas: false
  archive:
    - Disabled in master-only mode. Do not create iterations or merge deltas.
